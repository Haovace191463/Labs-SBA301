services:
  mongodb:
    image: mongo:8.0
    container_name: sba301-slot32-mongodb
    ports:
      - "27017:27017"
    volumes:
      - slot32-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  slot32-mongodb-data:
