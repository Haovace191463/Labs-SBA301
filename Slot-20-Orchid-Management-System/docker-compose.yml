services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orchid-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Your_strong_password123}
    ports:
      - "1433:1433"
    volumes:
      - orchid-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  orchid-sql-data:
